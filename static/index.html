<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cover Demo</title>
<style>
  :root {
    --bg: #fafafa;
    --panel-border: #e2e2df;
    --ink: #16161a;
    --muted: #6b6b70;
    --accent: #2f5d50;
    --accent-soft: #e9f0ee;
    --error: #b3261e;
    --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    padding: 20px 32px 16px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
  }

  header span {
    font-size: 12px;
    color: var(--muted);
  }

  main {
    flex: 1;
    display: flex;
    position: relative;
  }

  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 32px;
    gap: 18px;
    min-width: 0;
  }

  .panel-left { border-right: 1px solid var(--panel-border); }

  .panel-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .panel-title .glyph {
    font-size: 15px;
  }

  label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .field { display: flex; flex-direction: column; }

  textarea {
    resize: vertical;
    min-height: 64px;
    padding: 10px 12px;
    background: #fff;
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink);
    line-height: 1.5;
  }

  textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }

  button {
    align-self: flex-start;
    padding: 9px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  button:hover { opacity: 0.85; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: default; }

  .result-block {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: auto;
  }

  .result-box {
    min-height: 72px;
    padding: 10px 12px;
    background: var(--accent-soft);
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--ink);
  }

  .result-box.empty { color: var(--muted); font-style: italic; }
  .result-box.error { color: var(--error); background: #fbeceb; border-color: #eec8c5; }

  .result-box.streaming::after {
    content: '▍';
    display: inline-block;
    margin-left: 1px;
    color: var(--accent);
    animation: caret-blink 0.9s steps(1) infinite;
  }

  @keyframes caret-blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .divider {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 1px;
    display: none;
  }

  footer {
    padding: 12px 32px;
    border-top: 1px solid var(--panel-border);
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }

  @media (max-width: 720px) {
    main { flex-direction: column; }
    .panel-left { border-right: none; border-bottom: 1px solid var(--panel-border); }
  }
</style>
</head>
<body>

<header>
  <h1>Cover Demo</h1>
  <span id="status">idle</span>
</header>

<main>
  <section class="panel panel-left">
    <div class="panel-title"><span class="glyph">&#8594;</span> Encode</div>

    <div class="field">
      <label for="enc-context">Context</label>
      <textarea id="enc-context" placeholder="Seed for the generated text"></textarea>
    </div>

    <div class="field">
      <label for="enc-message">Message</label>
      <textarea id="enc-message" placeholder="Message to hide"></textarea>
    </div>

    <button id="enc-submit" type="button">Encode</button>

    <div class="result-block">
      <label>Result</label>
      <div id="enc-result" class="result-box empty">Output will appear here</div>
    </div>
  </section>

  <section class="panel panel-right">
    <div class="panel-title"><span class="glyph">&#8592;</span> Decode</div>

    <div class="field">
      <label for="dec-context">Context</label>
      <textarea id="dec-context" placeholder="Seed for the generated text (must be same as in encoding)"></textarea>
    </div>

    <div class="field">
      <label for="dec-message">Message</label>
      <textarea id="dec-message" placeholder="Encoded text (context not included)"></textarea>
    </div>

    <button id="dec-submit" type="button">Decode</button>

    <div class="result-block">
      <label>Result</label>
      <div id="dec-result" class="result-box empty">Output will appear here</div>
    </div>
  </section>
</main>

<!--<footer>POST /encode &middot; POST /decode &mdash; both SSE: token&hellip; then done &mdash; body: {"context": string, "message": string}</footer>-->

<script>
  const statusEl = document.getElementById('status');

  function setStatus(text) {
    statusEl.textContent = text;
  }

  async function readErrorDetail(res) {
    let detail = res.statusText;
    try {
      const errBody = await res.json();
      detail = errBody.detail || detail;
    } catch (_) {}
    return `${res.status} ${detail}`;
  }

  // Parses one SSE event block (lines between blank-line separators) into
  // { event, data }, per the "event:"/"data:" field format sse-starlette emits.
  function parseSSEEvent(raw) {
    let event = 'message';
    const dataLines = [];
    for (const line of raw.split('\n')) {
      if (line.startsWith('event:')) {
        event = line.slice(6).trim();
      } else if (line.startsWith('data:')) {
        dataLines.push(line.slice(5).replace(/^ /, ''));
      }
    }
    if (event === 'message' && dataLines.length === 0) return null;
    return { event, data: dataLines.join('\n') };
  }

  // Some SSE setups run each token through json.dumps() before sending, so a
  // token can arrive as a JSON string literal, e.g. "\n" (quote, backslash,
  // n, quote) instead of an actual newline. Unwrap that case; leave plain
  // tokens (the common case) untouched.
  function unwrapToken(raw) {
    if (raw.length >= 2 && raw.startsWith('"') && raw.endsWith('"')) {
      try {
        const parsed = JSON.parse(raw);
        if (typeof parsed === 'string') return parsed;
      } catch (_) {
        // not valid JSON — fall through and use the raw text as-is
      }
    }
    return raw;
  }

  // Decode: /decode now streams "token" events over SSE, same wire format as
  // /encode (sent via raw_data=..., so no JSON-unwrapping needed here either).
  // Unlike encode, each token *replaces* the currently displayed result
  // rather than appending to it — the last token received before "done" is
  // the final decoded value.
  async function submitDecode() {
    const contextEl = document.getElementById('dec-context');
    const messageEl = document.getElementById('dec-message');
    const button = document.getElementById('dec-submit');
    const resultEl = document.getElementById('dec-result');

    button.disabled = true;
    setStatus('running /decode');
    resultEl.classList.remove('empty', 'error');
    resultEl.classList.add('streaming');
    resultEl.textContent = '';

    let latest = '';
    let receivedAny = false;

    try {
      const res = await fetch('/decode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ context: contextEl.value, message: messageEl.value })
      });

      if (!res.ok) throw new Error(await readErrorDetail(res));
      if (!res.body) throw new Error('Streaming not supported by this browser');

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let done = false;

      while (!done) {
        const { done: streamDone, value } = await reader.read();
        if (streamDone) break;
        buffer += decoder.decode(value, { stream: true });

        let boundary;
        while ((boundary = buffer.indexOf('\n\n')) !== -1) {
          const rawEvent = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          const parsed = parseSSEEvent(rawEvent);
          if (!parsed) continue;

          if (parsed.event === 'done') {
            done = true;
            break;
          }
          if (parsed.event === 'token') {
            latest = parsed.data;
            receivedAny = true;
            resultEl.textContent = latest;
          }
        }
      }

      resultEl.classList.remove('streaming');
      if (!receivedAny) {
        resultEl.classList.add('empty');
        resultEl.textContent = 'Empty result';
      }
      setStatus('idle');
    } catch (err) {
      resultEl.classList.remove('streaming');
      resultEl.classList.add('error');
      resultEl.textContent = `Error: ${err.message}`;
      setStatus('error');
    } finally {
      button.disabled = false;
    }
  }

  // Encode: /encode now streams "token" events (one word each) followed by a
  // "done" event over SSE. Native EventSource only supports GET, so the POST
  // body is sent via fetch and the response stream is parsed by hand,
  // appending each word to the result box as it arrives.
  async function submitEncode() {
    const contextEl = document.getElementById('enc-context');
    const messageEl = document.getElementById('enc-message');
    const button = document.getElementById('enc-submit');
    const resultEl = document.getElementById('enc-result');

    button.disabled = true;
    setStatus('running /encode');
    resultEl.classList.remove('empty', 'error');
    resultEl.classList.add('streaming');
    resultEl.textContent = '';

    let accumulated = '';
    let receivedAny = false;

    try {
      const res = await fetch('/encode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ context: contextEl.value, message: messageEl.value })
      });

      if (!res.ok) throw new Error(await readErrorDetail(res));
      if (!res.body) throw new Error('Streaming not supported by this browser');

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let done = false;

      while (!done) {
        const { done: streamDone, value } = await reader.read();
        if (streamDone) break;
        buffer += decoder.decode(value, { stream: true });

        let boundary;
        while ((boundary = buffer.indexOf('\n\n')) !== -1) {
          const rawEvent = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          const parsed = parseSSEEvent(rawEvent);
          if (!parsed) continue;

          if (parsed.event === 'done') {
            done = true;
            break;
          }
          if (parsed.event === 'token') {
            accumulated += unwrapToken(parsed.data);
            receivedAny = true;
            resultEl.textContent = accumulated;
          }
        }
      }

      resultEl.classList.remove('streaming');
      if (!receivedAny) {
        resultEl.classList.add('empty');
        resultEl.textContent = 'Empty result';
      }
      setStatus('idle');
    } catch (err) {
      resultEl.classList.remove('streaming');
      resultEl.classList.add('error');
      resultEl.textContent = `Error: ${err.message}`;
      setStatus('error');
    } finally {
      button.disabled = false;
    }
  }

  document.getElementById('enc-submit').addEventListener('click', submitEncode);
  document.getElementById('dec-submit').addEventListener('click', submitDecode);
</script>

</body>
</html>
